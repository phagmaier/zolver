# RANGE/SPR axis: 3-bet pot — narrow, condensed ranges and a lower SPR (2.5)
# than the SRP baseline. Fewer combos per node, shallower money.
[game]
flop = "As 8d 3c"
initial_pot = 100
effective_stack = 250
min_bet = 2
# Preserve the physical-runout baseline after compression became the CLI default.
compress_suits = false

[game.sizings]
flop = [33, 75]
turn = [66]
river = [75]

[game.raise_cap]
flop = 1
turn = 1
river = 0

[ranges]
oop = "99+, AJs+, KQs, AQo+, A5s, A4s, KJs, QJs"
ip  = "TT+, AQs+, AKo, KQs, AJs, KJs"

[solver]
algorithm = "dcfr"
max_iterations = 128
target_exploitability_pct = 0.0001
num_threads = 8
prune_zero_reach = true
