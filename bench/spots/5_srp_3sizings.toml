# SIZINGS axis: baseline with 3 bet sizes on every street (branching stress).
[game]
flop = "As 8d 3c"
initial_pot = 100
effective_stack = 400
min_bet = 2
# Preserve the physical-runout baseline after compression became the CLI default.
compress_suits = false

[game.sizings]
flop = [25, 50, 100]
turn = [33, 75]
river = [50, 100]

[game.raise_cap]
flop = 1
turn = 1
river = 0

[ranges]
oop = "77+, A9s+, KTs+, QTs+, JTs, T9s, 98s, AJo+, KQo"
ip  = "99+, AJs+, KQs, AQo+, KJs, QJs"

[solver]
algorithm = "dcfr"
max_iterations = 128
target_exploitability_pct = 0.0001
num_threads = 8
prune_zero_reach = true
