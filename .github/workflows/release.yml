name: Release

on:
  push:
    tags: ["v*"]

# Zolver is Linux-only (the thread pool parks on a raw Linux futex; see
# src/threading.zig), so the release ships the two Linux ABIs only. Zig
# cross-compiles both from a single Linux runner.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Run tests
        run: zig build test

      - name: Cross-compile Linux targets
        run: |
          mkdir -p dist
          build() { # <zig-target> <output-name>
            zig build -Doptimize=ReleaseFast -Dtarget="$1" -p "out/$1"
            cp "out/$1/bin/zolver" "dist/$2"
          }
          build x86_64-linux  zolver-linux-x86_64
          build aarch64-linux zolver-linux-aarch64
          ls -la dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
